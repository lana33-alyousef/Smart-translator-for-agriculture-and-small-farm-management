<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background-color: #fdfdfd; }
        .header { background-color: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px 5px 0 0; text-align: center; }
        .content { padding: 20px; }
        .item { margin-bottom: 10px; }
        .item strong { color: #555; }
        .message-box { background-color: #f1f1f1; padding: 15px; border-radius: 5px; border-right: 4px solid #4CAF50; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>رسالة جديدة </h2>
        </div>
        <div class="content" dir="rtl">
            <div class="item"><strong>الاسم:</strong> {{ full_name }}</div>
            <div class="item"><strong>البريد الإلكتروني:</strong> {{ email }}</div>
            <div class="item"><strong>رقم الهاتف:</strong> {{ phone_number|default:"غير محدد" }}</div>
            <div class="item"><strong>نوع الاستفسار:</strong> {{ category }}</div>
            
            <div class="message-box">
                <strong>نص الرسالة:</strong><br>
                {{ message|linebreaks }}
            </div>
        </div>
    </div>
</body>
</html>
